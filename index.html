<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>凯撒密码工具 | 加密解密+字母频率分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #2d3748;
            padding: 30px;
            line-height: 1.6;
        }

        .container {
            width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2b6cb0;
            margin-bottom: 40px;
            font-size: 30px;
            font-weight: 700;
        }

        .tab-container {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: #718096;
            cursor: pointer;
            font-size: 18px;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn:hover {
            color: #2b6cb0;
        }

        .tab-btn.active {
            color: #2b6cb0;
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2b6cb0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 凯撒密码模块样式 */
        .caesar-box {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #4a5568;
            font-size: 16px;
        }

        input[type="number"] {
            width: 120px;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #2b6cb0;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            resize: vertical;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #2b6cb0;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2c5282;
        }

        button.secondary {
            background-color: #718096;
        }

        button.secondary:hover {
            background-color: #4a5568;
        }

        /* 频率分析模块样式 */
        .frequency-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .single-letter, .double-letter {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .frequency-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2b6cb0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .frequency-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .frequency-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 15px;
        }

        .frequency-item:last-child {
            border-bottom: none;
        }

        .item-label {
            font-weight: 600;
            color: #2d3748;
        }

        .item-value {
            color: #e53e3e;
            font-weight: 600;
        }

        .standard-label {
            color: #38a169;
            margin-left: 10px;
            font-weight: normal;
        }

        /* 滚动条样式优化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>凯撒密码工具 | 加密解密 + 字母频率分析</h1>

        <!-- 标签页切换 -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="caesar">凯撒密码</button>
            <button class="tab-btn" data-tab="frequency">频率分析</button>
        </div>

        <!-- 凯撒密码标签页 -->
        <div class="tab-content active" id="caesar">
            <div class="caesar-box">
                <div class="form-group">
                    <label>偏移量（1-25）：</label>
                    <input type="number" id="offset" min="1" max="25" value="3">
                </div>

                <div class="form-group">
                    <label>输入文本（仅处理英文字母，其他字符不变）：</label>
                    <textarea id="caesarInput" placeholder="请输入需要加密/解密的英文文本...">Hello World!</textarea>
                </div>

                <div class="btn-group">
                    <button id="encryptBtn">加密</button>
                    <button id="decryptBtn">解密</button>
                    <button id="clearCaesarBtn" class="secondary">清空</button>
                    <button id="copyCaesarBtn" class="secondary">复制结果</button>
                </div>

                <div class="form-group">
                    <label>结果：</label>
                    <textarea id="caesarOutput" readonly placeholder="加密/解密结果将显示在这里..."></textarea>
                </div>
            </div>
        </div>

        <!-- 频率分析标签页 -->
        <div class="tab-content" id="frequency">
            <div class="form-group">
                <label>输入需要分析的英文文本：</label>
                <textarea id="frequencyInput" placeholder="请输入英文文本，将自动分析单字母和双字母频率...">The quick brown fox jumps over the lazy dog. This is a sample text for frequency analysis.</textarea>
                <button id="analyzeBtn" style="margin-top: 10px;">开始分析</button>
            </div>

            <div class="frequency-box">
                <!-- 单字母频率 -->
                <div class="single-letter">
                    <div class="frequency-title">单字母频率（%）| 标准英语频率（%）</div>
                    <div class="frequency-list" id="singleLetterList"></div>
                </div>

                <!-- 双字母频率 -->
                <div class="double-letter">
                    <div class="frequency-title">双字母频率（%）| 标准英语高频双字母（参考）</div>
                    <div class="frequency-list" id="doubleLetterList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 标签页切换逻辑
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有激活状态
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // 激活当前标签
                btn.classList.add('active');
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // 2. 凯撒密码核心逻辑
        // 加密函数
        function caesarEncrypt(text, offset) {
            return text.split('').map(char => {
                // 处理大写字母
                if (char >= 'A' && char <= 'Z') {
                    return String.fromCharCode((char.charCodeAt(0) - 65 + offset) % 26 + 65);
                }
                // 处理小写字母
                else if (char >= 'a' && char <= 'z') {
                    return String.fromCharCode((char.charCodeAt(0) - 97 + offset) % 26 + 97);
                }
                // 其他字符不变
                else {
                    return char;
                }
            }).join('');
        }

        // 解密函数（偏移量取反）
        function caesarDecrypt(text, offset) {
            return caesarEncrypt(text, 26 - (offset % 26));
        }

        // 加密按钮点击
        document.getElementById('encryptBtn').addEventListener('click', () => {
            const input = document.getElementById('caesarInput').value;
            const offset = parseInt(document.getElementById('offset').value) || 3;
            const result = caesarEncrypt(input, offset);
            document.getElementById('caesarOutput').value = result;
        });

        // 解密按钮点击
        document.getElementById('decryptBtn').addEventListener('click', () => {
            const input = document.getElementById('caesarInput').value;
            const offset = parseInt(document.getElementById('offset').value) || 3;
            const result = caesarDecrypt(input, offset);
            document.getElementById('caesarOutput').value = result;
        });

        // 清空按钮
        document.getElementById('clearCaesarBtn').addEventListener('click', () => {
            document.getElementById('caesarInput').value = '';
            document.getElementById('caesarOutput').value = '';
        });

        // 复制结果按钮
        document.getElementById('copyCaesarBtn').addEventListener('click', async () => {
            const output = document.getElementById('caesarOutput').value;
            if (!output) {
                alert('暂无结果可复制！');
                return;
            }
            try {
                await navigator.clipboard.writeText(output);
                alert('结果复制成功！');
            } catch (err) {
                alert('复制失败，请手动复制！');
                console.error(err);
            }
        });

        // 3. 频率分析核心逻辑
        // 标准英语单字母频率（%）
        const standardSingleFreq = {
            'A': 8.167, 'B': 1.492, 'C': 2.782, 'D': 4.253, 'E': 12.702,
            'F': 2.228, 'G': 2.015, 'H': 6.094, 'I': 6.966, 'J': 0.153,
            'K': 0.772, 'L': 4.025, 'M': 2.406, 'N': 6.749, 'O': 7.507,
            'P': 1.929, 'Q': 0.095, 'R': 5.987, 'S': 6.327, 'T': 9.056,
            'U': 2.758, 'V': 0.978, 'W': 2.360, 'X': 0.150, 'Y': 1.974,
            'Z': 0.074
        };

        // 标准英语高频双字母（参考）
        const standardDoubleFreq = [
            'TH', 'HE', 'IN', 'ER', 'AN', 'RE', 'ED', 'ON', 'ES', 'ST',
            'EN', 'AT', 'TO', 'NT', 'HA', 'ND', 'OU', 'EA', 'NG', 'AS'
        ];

        // 频率分析函数
        function analyzeFrequency(text) {
            // 预处理：转为大写，仅保留字母
            const cleanText = text.replace(/[^A-Za-z]/g, '').toUpperCase();
            const totalChars = cleanText.length;
            
            if (totalChars === 0) {
                alert('请输入有效的英文文本（至少包含一个字母）！');
                return { single: {}, double: {} };
            }

            // 单字母频率统计
            const singleCount = {};
            for (let char of cleanText) {
                singleCount[char] = (singleCount[char] || 0) + 1;
            }

            // 计算单字母频率（%）并排序
            const singleFreq = {};
            for (let char of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
                const count = singleCount[char] || 0;
                singleFreq[char] = ((count / totalChars) * 100).toFixed(3);
            }
            const sortedSingle = Object.entries(singleFreq)
                .sort((a, b) => b[1] - a[1]);

            // 双字母频率统计
            const doubleCount = {};
            for (let i = 0; i < cleanText.length - 1; i++) {
                const pair = cleanText[i] + cleanText[i + 1];
                doubleCount[pair] = (doubleCount[pair] || 0) + 1;
            }
            const totalPairs = cleanText.length - 1;
            
            // 计算双字母频率（%）并排序
            const doubleFreq = {};
            for (let pair in doubleCount) {
                doubleFreq[pair] = ((doubleCount[pair] / totalPairs) * 100).toFixed(3);
            }
            const sortedDouble = Object.entries(doubleFreq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 20); // 只显示前20个高频双字母

            return { single: sortedSingle, double: sortedDouble };
        }

        // 分析按钮点击
        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const input = document.getElementById('frequencyInput').value;
            const result = analyzeFrequency(input);

            // 渲染单字母频率
            const singleList = document.getElementById('singleLetterList');
            singleList.innerHTML = '';
            result.single.forEach(([char, freq]) => {
                const standardFreq = standardSingleFreq[char].toFixed(3);
                const item = document.createElement('div');
                item.className = 'frequency-item';
                item.innerHTML = `
                    <span class="item-label">${char}</span>
                    <span class="item-value">${freq} 
                        <span class="standard-label">（标准：${standardFreq}）</span>
                    </span>
                `;
                singleList.appendChild(item);
            });

            // 渲染双字母频率
            const doubleList = document.getElementById('doubleLetterList');
            doubleList.innerHTML = '';
            result.double.forEach(([pair, freq]) => {
                // 标记是否为标准高频双字母
                const isStandard = standardDoubleFreq.includes(pair) ? '(标准高频)' : '';
                const item = document.createElement('div');
                item.className = 'frequency-item';
                item.innerHTML = `
                    <span class="item-label">${pair}</span>
                    <span class="item-value">${freq} 
                        <span class="standard-label">${isStandard}</span>
                    </span>
                `;
                doubleList.appendChild(item);
            });

            // 补充标准双字母说明（如果分析结果不足20个）
            if (result.double.length < 20) {
                const remaining = 20 - result.double.length;
                standardDoubleFreq.slice(result.double.length, result.double.length + remaining).forEach(pair => {
                    const item = document.createElement('div');
                    item.className = 'frequency-item';
                    item.innerHTML = `
                        <span class="item-label">${pair}</span>
                        <span class="item-value">- 
                            <span class="standard-label">（标准高频，文本中未出现）</span>
                        </span>
                    `;
                    doubleList.appendChild(item);
                });
            }
        });

        // 初始化频率分析（默认文本）
        document.getElementById('analyzeBtn').click();
    </script>
</body>
</html>
